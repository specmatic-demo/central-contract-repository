name: Specmatic Central Contract Report

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate and send Specmatic report
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/.specmatic
          echo "${{ secrets.SPECMATIC_LICENSE_KEY }}" > ~/.specmatic/specmatic-license.txt
          curl -fsSL https://docs.specmatic.io/install-specmatic-enterprise.sh | bash
          java -jar ~/.specmatic/specmatic-enterprise.jar central-contract-repo-report
          java -jar ~/.specmatic/specmatic-enterprise.jar send-report \
            --repo-id="${{ github.event.repository.id }}" \
            --repo-name="${{ github.event.repository.name }}" \
            --repo-url="${{ github.server_url }}/${{ github.repository }}" \
            --branch-name="${{ github.ref_name }}"
