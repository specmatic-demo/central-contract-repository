syntax = "proto3";

package payment.v1;

service PaymentService {
  rpc CapturePayment (CapturePaymentRequest) returns (CapturePaymentResponse);
}

message CapturePaymentRequest {
  string payment_id = 1;
  double amount = 2;
}

message CapturePaymentResponse {
  string payment_id = 1;
  string status = 2;
  string captured_at = 3;
}
