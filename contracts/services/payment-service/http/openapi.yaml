openapi: 3.0.3
info:
  title: Payment Service API
  version: 1.1.0
servers:
  - url: https://payment.internal.example.com
paths:
  /payments/authorize:
    post:
      summary: Authorize a payment
      operationId: authorizePayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentAuthorizationRequest'
      responses:
        '200':
          description: Authorization result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAuthorizationResult'
        '400':
          description: Invalid payment authorization request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /payments/{paymentId}/capture:
    post:
      summary: Capture a previously authorized payment
      operationId: capturePayment
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCaptureRequest'
      responses:
        '200':
          description: Capture result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCaptureResult'
        '400':
          description: Invalid capture request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Payment not found
  /payments/{paymentId}/refund:
    post:
      summary: Refund a captured payment
      operationId: refundPayment
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRefundRequest'
      responses:
        '200':
          description: Refund result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRefundResult'
        '400':
          description: Invalid refund request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Payment not found
components:
  schemas:
    PaymentAuthorizationRequest:
      type: object
      required: [orderId, amount, currency, paymentMethodId]
      properties:
        orderId:
          type: string
        amount:
          type: number
        currency:
          type: string
          minLength: 3
          maxLength: 3
        paymentMethodId:
          type: string
    PaymentAuthorizationResult:
      type: object
      required: [paymentId, orderId, status, authorizedAmount]
      properties:
        paymentId:
          type: string
        orderId:
          type: string
        status:
          type: string
          enum: [AUTHORIZED, DECLINED]
        authorizedAmount:
          type: number
    PaymentCaptureRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          minimum: 0
    PaymentCaptureResult:
      type: object
      required: [paymentId, status, capturedAmount, capturedAt]
      properties:
        paymentId:
          type: string
        status:
          type: string
          enum: [CAPTURED, CAPTURE_FAILED]
        capturedAmount:
          type: number
        capturedAt:
          type: string
          format: date-time
    PaymentRefundRequest:
      type: object
      required: [amount, reason]
      properties:
        amount:
          type: number
          minimum: 0.01
        reason:
          type: string
          maxLength: 256
    PaymentRefundResult:
      type: object
      required: [paymentId, refundId, status, refundedAmount, refundedAt]
      properties:
        paymentId:
          type: string
        refundId:
          type: string
        status:
          type: string
          enum: [REFUNDED, REFUND_FAILED]
        refundedAmount:
          type: number
        refundedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
