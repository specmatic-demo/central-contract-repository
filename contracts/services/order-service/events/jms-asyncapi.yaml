asyncapi: 3.0.0
info:
  title: Order Service JMS Messages
  version: 1.1.0
defaultContentType: application/json
channels:
  shippingDispatchCommandQueue:
    address: queue.shipping.dispatch.command
    messages:
      dispatchCommand:
        $ref: '#/components/messages/DispatchCommand'
  orderFulfillmentReplyQueue:
    address: queue.order.fulfillment.reply
    messages:
      fulfillmentReply:
        $ref: '#/components/messages/FulfillmentReply'
operations:
  sendDispatchCommand:
    action: send
    summary: Sends dispatch commands to shipping/warehouse systems
    channel:
      $ref: '#/channels/shippingDispatchCommandQueue'
    messages:
      - $ref: '#/channels/shippingDispatchCommandQueue/messages/dispatchCommand'
  receiveFulfillmentReply:
    action: receive
    summary: Receives fulfillment reply correlated to dispatch command
    channel:
      $ref: '#/channels/orderFulfillmentReplyQueue'
    messages:
      - $ref: '#/channels/orderFulfillmentReplyQueue/messages/fulfillmentReply'
components:
  messages:
    DispatchCommand:
      payload:
        type: object
        required: [messageId, requestId, orderId, warehouseCode, items]
        properties:
          messageId:
            type: string
          requestId:
            type: string
          orderId:
            type: string
          warehouseCode:
            type: string
          items:
            type: array
            items:
              type: object
              required: [sku, quantity]
              properties:
                sku:
                  type: string
                quantity:
                  type: integer
                  minimum: 1
    FulfillmentReply:
      payload:
        type: object
        required: [messageId, requestId, orderId, status, repliedAt]
        properties:
          messageId:
            type: string
          requestId:
            type: string
          orderId:
            type: string
          status:
            type: string
            enum: [ACCEPTED, REJECTED, PARTIAL]
          repliedAt:
            type: string
            format: date-time
          rejectionReason:
            type: string
