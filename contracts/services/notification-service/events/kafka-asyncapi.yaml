asyncapi: 3.0.0
info:
  title: Notification Service Kafka Events
  version: 1.1.0
defaultContentType: application/json
channels:
  notificationDispatchRequest:
    address: notification.dispatch.request
    messages:
      dispatchRequest:
        $ref: '#/components/messages/NotificationDispatchRequest'
  notificationDispatchReply:
    address: notification.dispatch.reply
    messages:
      dispatchReply:
        $ref: '#/components/messages/NotificationDispatchReply'
  notificationSent:
    address: notification.sent
    messages:
      notificationSent:
        $ref: '#/components/messages/NotificationSent'
operations:
  receiveDispatchRequest:
    action: receive
    summary: Receives notification dispatch requests from upstream services
    channel:
      $ref: '#/channels/notificationDispatchRequest'
    messages:
      - $ref: '#/channels/notificationDispatchRequest/messages/dispatchRequest'
  sendDispatchReply:
    action: send
    summary: Sends dispatch acceptance/rejection correlated to request
    channel:
      $ref: '#/channels/notificationDispatchReply'
    messages:
      - $ref: '#/channels/notificationDispatchReply/messages/dispatchReply'
  publishNotificationSent:
    action: send
    summary: Published after notification dispatch
    channel:
      $ref: '#/channels/notificationSent'
    messages:
      - $ref: '#/channels/notificationSent/messages/notificationSent'
components:
  messages:
    NotificationDispatchRequest:
      payload:
        type: object
        required: [requestId, notificationId, userId, channel, requestedAt]
        properties:
          requestId:
            type: string
          notificationId:
            type: string
          userId:
            type: string
          channel:
            type: string
            enum: [EMAIL, SMS, PUSH, IN_APP]
          requestedAt:
            type: string
            format: date-time
    NotificationDispatchReply:
      payload:
        type: object
        required: [requestId, notificationId, status, repliedAt]
        properties:
          requestId:
            type: string
          notificationId:
            type: string
          status:
            type: string
            enum: [ACCEPTED, REJECTED]
          failureReason:
            type: string
          repliedAt:
            type: string
            format: date-time
    NotificationSent:
      payload:
        type: object
        required: [eventId, notificationId, userId, channel, sentAt]
        properties:
          eventId:
            type: string
          notificationId:
            type: string
          userId:
            type: string
          channel:
            type: string
            enum: [EMAIL, SMS, PUSH, IN_APP]
          sentAt:
            type: string
            format: date-time
