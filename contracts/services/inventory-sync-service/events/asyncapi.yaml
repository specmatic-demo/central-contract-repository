asyncapi: 3.0.0
info:
  title: Inventory Sync Service Events
  version: 1.0.0
defaultContentType: application/json
channels:
  inventoryAdjustmentRequest:
    address: inventory.adjustment.request
    messages:
      inventoryAdjustmentRequest:
        $ref: '#/components/messages/InventoryAdjustmentRequest'
  inventoryAdjusted:
    address: inventory/adjusted
    messages:
      inventoryAdjusted:
        $ref: '#/components/messages/InventoryAdjusted'
operations:
  receiveInventoryAdjustmentRequest:
    action: receive
    summary: Receives stock adjustment commands from upstream order workflows
    channel:
      $ref: '#/channels/inventoryAdjustmentRequest'
    messages:
      - $ref: '#/channels/inventoryAdjustmentRequest/messages/inventoryAdjustmentRequest'
  publishInventoryAdjusted:
    action: send
    summary: Publishes adjusted stock state to MQTT subscribers
    channel:
      $ref: '#/channels/inventoryAdjusted'
    messages:
      - $ref: '#/channels/inventoryAdjusted/messages/inventoryAdjusted'
components:
  messages:
    InventoryAdjustmentRequest:
      payload:
        type: object
        required: [requestId, sku, adjustmentDelta, reason, requestedAt]
        properties:
          requestId:
            type: string
          sku:
            type: string
          adjustmentDelta:
            type: integer
          reason:
            type: string
            enum: [ORDER_PLACED, ORDER_CANCELLED, RETURN_RECEIVED, MANUAL_RECONCILIATION]
          requestedAt:
            type: string
            format: date-time
    InventoryAdjusted:
      payload:
        type: object
        required: [eventId, requestId, sku, quantityOnHand, available, publishedAt]
        properties:
          eventId:
            type: string
          requestId:
            type: string
          sku:
            type: string
          quantityOnHand:
            type: integer
            minimum: 0
          available:
            type: boolean
          publishedAt:
            type: string
            format: date-time
