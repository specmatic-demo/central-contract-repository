openapi: 3.0.3
info:
  title: Customer Service API
  version: 1.1.0
servers:
  - url: https://customer.internal.example.com
paths:
  /customers:
    post:
      summary: Create a customer profile
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /customers/{customerId}:
    get:
      summary: Fetch a customer profile
      operationId: getCustomer
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Customer profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Customer not found
  /customers/{customerId}/preferences:
    get:
      summary: Fetch customer preferences
      operationId: getPreferences
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Customer preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPreferences'
        '404':
          description: Customer not found
    patch:
      summary: Update customer preferences
      operationId: updatePreferences
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPreferences'
      responses:
        '200':
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPreferences'
        '400':
          description: Invalid preferences payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CreateCustomerRequest:
      type: object
      required: [email, tier, preferences]
      properties:
        email:
          type: string
          format: email
        tier:
          type: string
          enum: [STANDARD, GOLD, PLATINUM]
        preferences:
          $ref: '#/components/schemas/CustomerPreferences'
    Customer:
      type: object
      required: [id, email, tier, preferences]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        tier:
          type: string
          enum: [STANDARD, GOLD, PLATINUM]
        preferences:
          $ref: '#/components/schemas/CustomerPreferences'
    CustomerPreferences:
      type: object
      required: [newsletter, language]
      properties:
        newsletter:
          type: boolean
        language:
          type: string
          example: en-US
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
