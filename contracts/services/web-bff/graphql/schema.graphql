schema {
  query: Query
  mutation: Mutation
}

type Query {
  customer(id: ID!): Customer
  catalogItems(category: String, limit: Int = 10): [CatalogItem!]!
  order(id: ID!): Order
  quotePrice(sku: String!, quantity: Int!): PriceQuote!
}

type Mutation {
  placeOrder(input: PlaceOrderInput!): PlaceOrderResult!
}

type Customer {
  id: ID!
  email: String!
  tier: String!
}

type CatalogItem {
  sku: String!
  name: String!
  available: Boolean!
  listPrice: Float!
}

type Order {
  id: ID!
  customerId: ID!
  status: String!
  totalAmount: Float!
}

type PriceQuote {
  sku: String!
  quantity: Int!
  unitPrice: Float!
  totalPrice: Float!
}

input PlaceOrderInput {
  customerId: ID!
  sku: String!
  quantity: Int!
  paymentMethodId: String!
}

type PlaceOrderResult {
  orderId: ID!
  status: String!
}
