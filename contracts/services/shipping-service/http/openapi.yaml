openapi: 3.0.3
info:
  title: Shipping Service API
  version: 1.1.0
servers:
  - url: https://shipping.internal.example.com
paths:
  /shipments:
    post:
      summary: Create shipment for an order
      operationId: createShipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShipmentRequest'
      responses:
        '201':
          description: Shipment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '400':
          description: Invalid shipment request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List shipments
      operationId: listShipments
      parameters:
        - name: orderId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of shipments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Shipment'
  /shipments/{shipmentId}:
    get:
      summary: Get shipment status
      operationId: getShipment
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Shipment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '404':
          description: Shipment not found
  /shipments/{shipmentId}/cancel:
    post:
      summary: Cancel shipment before dispatch completion
      operationId: cancelShipment
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Shipment cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '404':
          description: Shipment not found
components:
  schemas:
    CreateShipmentRequest:
      type: object
      required: [orderId, destinationPostalCode]
      properties:
        orderId:
          type: string
        destinationPostalCode:
          type: string
    Shipment:
      type: object
      required: [shipmentId, orderId, carrier, trackingNumber, status]
      properties:
        shipmentId:
          type: string
        orderId:
          type: string
        carrier:
          type: string
        trackingNumber:
          type: string
        status:
          type: string
          enum: [CREATED, IN_TRANSIT, DELIVERED, DELAYED, CANCELLED]
        cancelledAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
